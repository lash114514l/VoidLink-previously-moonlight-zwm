name: iOS CI (Integration)

on:
  push:
    branches: [ Integration ]
  pull_request:
    branches: [ Integration ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project VoidLink.xcodeproj -scheme "VoidLink"

      - name: Download iOS platform (ensure simulator runtimes)
        run: xcodebuild -downloadPlatform iOS || true

      - name: Build Debug (iOS Simulator)
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme "VoidLink" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build Release (iOS Simulator)
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme "VoidLink" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Upload Debug .app
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-Debug-iphonesimulator
          path: build/**/Debug-iphonesimulator/VoidLink.app

      - name: Upload Release .app
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-Release-iphonesimulator
          path: build/**/Release-iphonesimulator/VoidLink.app
